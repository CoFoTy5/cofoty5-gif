*{box-sizing:border-box}

.themes{display:flex;background:var(--input);border:1px solid var(--line);border-radius:20px;padding:2px}
.themes button{border:none;background:none;cursor:pointer;width:30px;height:26px;border-radius:14px;font-size:14px;line-height:1;opacity:.55}
.themes button.on{background:var(--panel2);opacity:1;box-shadow:0 0 0 1px var(--line)}

header{height:54px;padding:0 18px;flex-wrap:nowrap}

.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.menuw{position:relative;margin-left:8px}
.menub{border:1px solid var(--line);background:var(--panel2);color:var(--text);width:36px;height:34px;border-radius:8px;cursor:pointer;font-size:17px;line-height:1}

.menu{position:absolute;right:0;top:42px;z-index:50;min-width:220px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:8px}
.mh{font-size:11.5px;color:var(--muted);padding:4px 8px 6px}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.langs button{border:1px solid var(--line);background:var(--panel2);color:var(--text2);padding:6px 8px;border-radius:7px;cursor:pointer;font:inherit;font-size:12.5px;text-align:left}
.langs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.msep{height:1px;background:var(--line);margin:8px 2px}
.mi{display:block;padding:7px 8px;border-radius:7px;color:var(--text);text-decoration:none;font-size:13px}
.mi:hover{background:var(--panel2)}
.mver{font-size:11px;color:var(--muted);padding:6px 8px 2px}
.frames{height:calc(100% - 54px);position:relative}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.frames iframe.hide{visibility:hidden;pointer-events:none}
@media(max-width:900px){.sub,.credit{display:none}}

/* ---------- 다국어 (ko 원문 → en / ja / zh / tw) ----------

  PATS.push([re,k,order,lit.length]);
}

    const nums=[];const key=s.replace(/\s+/g,' ').replace(/\d+(?:\.\d+)?/g,m=>{nums.push(m);return '{'+(nums.length-1)+'}';});
    const t=look(key);

function trS(s){

  const rec=TO.get(n),cur=n.data,src=rec&&cur===rec[1]?rec[0]:cur;
  if(!HG.test(src)){if(rec)TO.delete(n);return;}

function doAttr(el,a){

const FONT={ja:'"Hiragino Sans","Yu Gothic UI","Meiryo","Noto Sans JP"',zh:'"PingFang SC","Microsoft YaHei","Noto Sans SC"',tw:'"PingFang TC","Microsoft JhengHei","Noto Sans TC"'};
function applyDoc(ent){
  const {doc,obs}=ent;
  doc.documentElement.lang=HTML_LANG[LANG];
  let st=doc.getElementById('i18n-font');
  if(!st){st=doc.createElement('style');st.id='i18n-font';(doc.head||doc.documentElement).appendChild(st);}
  st.textContent=FONT[LANG]?`body,button,input,select,textarea{font-family:"Pretendard",${FONT[LANG]},system-ui,sans-serif!important}`:'';
  if(ent.on){obs.disconnect();ent.on=false;}
  walk(doc.body||doc.documentElement);

  if(LANG!=='ko'){obs.observe(doc.documentElement,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:ATTRS});ent.on=true;}
}
function pickLang(){
  const q=new URLSearchParams(location.search).get('lang');
  const norm=v=>{v=(v||'').toLowerCase();
    if(v.startsWith('ko'))return 'ko';if(v.startsWith('ja'))return 'ja';
    if(v==='tw'||/^zh-(tw|hk|mo|hant)/.test(v))return 'tw';if(v.startsWith('zh'))return 'zh';
    if(v.startsWith('en'))return 'en';return null;};
  if(q&&norm(q))return norm(q);
  try{const s=localStorage.getItem('cofoty5-lang');if(s&&LANGS.some(l=>l[0]===s))return s;}catch(e){}
  for(const l of (navigator.languages||[navigator.language])){const n=norm(l);if(n)return n;}
  return 'en';
}
function setLang(l,save){
  if(!LANGS.some(x=>x[0]===l))l='ko';
  LANG=l;cache=new Map();
  if(save){try{localStorage.setItem('cofoty5-lang',l);}catch(e){}}
  DOCS.forEach(applyDoc);
  document.querySelectorAll('#langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
}

const dec=b=>new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0)));
const SUB={maker:'이미지 여러 장 → GIF · WebP · PSD',fx:'이미지 한 장 → 연출 효과를 입힌 GIF · WebP'};
const $=s=>document.querySelector(s);
if(location.protocol==='file:')$('#dl').hidden=true;
const menu=$('#menu');
$('#langs').innerHTML=LANGS.map(([k,n])=>`<button data-l="${k}" data-noi18n>${n}</button>`).join('');
$('#langs').onclick=e=>{const b=e.target.closest('button');if(b){setLang(b.dataset.l,true);menu.hidden=true;$('#menuBtn').classList.remove('on');}};
$('#menuBtn').onclick=e=>{e.stopPropagation();menu.hidden=!menu.hidden;$('#menuBtn').classList.toggle('on',!menu.hidden);};
document.addEventListener('click',e=>{if(!menu.hidden&&!e.target.closest('.menuw')){menu.hidden=true;$('#menuBtn').classList.remove('on');}});
for(const k of ['maker','fx'])$('#f-'+k).addEventListener('load',()=>{const w=$('#f-'+k).contentWindow;hookDoc(w.document,w);w.document.addEventListener('click',()=>{menu.hidden=true;$('#menuBtn').classList.remove('on');});});
hookDoc(document,window);
LANG=pickLang();setLang(LANG,false);
function setTheme(t){document.body.dataset.theme=t;[...$('#themes').children].forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  try{localStorage.setItem('umzzal-theme',t);}catch(e){}
  for(const k of ['maker','fx']){const w=$('#f-'+k).contentWindow;if(w)w.postMessage({type:'gif-theme',t},'*');}}
$('#themes').onclick=e=>{const b=e.target.closest('button');if(b)setTheme(b.dataset.t);};
function show(t){[...$('#tabs').children].forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $('#f-maker').classList.toggle('hide',t!=='maker');$('#f-fx').classList.toggle('hide',t!=='fx');$('#sub').textContent=SUB[t];
  history.replaceState(null,'',t==='fx'?'#fx':location.pathname+location.search);try{$('#f-'+t).contentWindow.focus();}catch(e){}}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.t);};
let st='light';try{st=localStorage.getItem('umzzal-theme')||'light';}catch(e){}
if(!['light','mid','dark'].includes(st))st='light';
document.body.dataset.theme=st;[...$('#themes').children].forEach(b=>b.classList.toggle('on',b.dataset.t===st));
$('#f-maker').srcdoc=dec(SRC.maker);$('#f-fx').srcdoc=dec(SRC.fx);
const dirty={maker:false,fx:false};
window.addEventListener('message',e=>{const d=e.data||{};
  if(d.type==='gif-dirty')dirty[d.tool]=!!d.v;
  if(d.type==='gif-send'&&d.file){show('maker');$('#f-maker').contentWindow.postMessage({type:'gif-add',file:d.file},'*');}});
document.addEventListener('keydown',e=>{if(!(e.ctrlKey||e.metaKey)||e.altKey)return;const k=e.key.toLowerCase();
  const d=(k==='z'&&!e.shiftKey)?-1:((k==='z'&&e.shiftKey)||k==='y')?1:0;if(!d)return;e.preventDefault();
  const t=$('#f-fx').classList.contains('hide')?'maker':'fx';$('#f-'+t).contentWindow.postMessage({type:'gif-hist',d},'*');});
window.addEventListener('beforeunload',e=>{if(dirty.maker||dirty.fx){e.preventDefault();e.returnValue='';}});
if(location.hash==='#fx')show('fx');
</script></body></html>
